apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knowledge-assistant-staging

namePrefix: staging-

bases:
- ../../base

commonLabels:
  environment: staging

patchesStrategicMerge:
- replica-patch.yaml
- resource-patch.yaml

configMapGenerator:
- name: backend-config
  literals:
  - auth-api-url=http://auth-api-staging.default.svc.cluster.local
  - user-service-url=http://user-service-staging.default.svc.cluster.local
  - cors-origins=https://staging.knowledge-assistant.example.com

- name: frontend-config
  literals:
  - api-url=https://staging.knowledge-assistant.example.com/api

images:
- name: knowledge-assistant-backend
  newTag: staging-latest
- name: knowledge-assistant-frontend
  newTag: staging-latest
