apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: knowledge-assistant-runtime
  labels:
    app: knowledge-assistant
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-assistant
      component: frontend
  template:
    metadata:
      labels:
        app: knowledge-assistant
        component: frontend
    spec:
      serviceAccountName: knowledge-assistant-frontend
      containers:
      - name: frontend
        image: knowledge-assistant-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: api-url
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - frontend
              topologyKey: topology.kubernetes.io/zone
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledge-assistant-frontend
  namespace: knowledge-assistant-runtime
