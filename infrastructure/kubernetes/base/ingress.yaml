apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-assistant-ingress
  namespace: knowledge-assistant-runtime
  labels:
    app: knowledge-assistant
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - knowledge-assistant.example.com
    secretName: knowledge-assistant-tls
  rules:
  - host: knowledge-assistant.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
