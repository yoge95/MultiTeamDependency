apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: knowledge-assistant-runtime
  labels:
    app: knowledge-assistant
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: knowledge-assistant
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: None
