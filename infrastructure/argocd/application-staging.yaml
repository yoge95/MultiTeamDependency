apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-assistant-staging
  namespace: argocd
  labels:
    app: knowledge-assistant
    environment: staging
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/multiteamdependency.git
    targetRevision: main
    path: infrastructure/kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: knowledge-assistant-staging
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
