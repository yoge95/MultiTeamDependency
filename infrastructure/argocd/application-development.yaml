apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-assistant-development
  namespace: argocd
  labels:
    app: knowledge-assistant
    environment: development
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/multiteamdependency.git
    targetRevision: develop
    path: infrastructure/kubernetes/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: knowledge-assistant-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
